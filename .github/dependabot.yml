version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types:
          - minor
          - patch
    ignore:
      # Keep in lockstep with the Rust tauri pin in src-tauri/Cargo.toml; tauri build rejects mismatched minors.
      - dependency-name: '@tauri-apps/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      # Cargo 0.x minor releases may contain breaking API changes, so only patches are grouped.
      rust-patches:
        applies-to: version-updates
        patterns: ['*']
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types:
          - minor
          - patch
